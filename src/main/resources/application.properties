# Alamat service memakai nama container di network demo-net (ollama, demo-mysql, demo-redis).
# MySQL dan Redis dipakai bersama dengan demo HR: schema clinic dan prefix med-rag: terpisah.
# Dev mode (mvnw quarkus:dev) jalan di laptop, jadi profil %dev tetap memakai localhost.

# Ollama
quarkus.langchain4j.ollama.base-url=http://ollama:11434
%dev.quarkus.langchain4j.ollama.base-url=http://localhost:11434
quarkus.langchain4j.ollama.chat-model.model-id=llama3.1:8b
quarkus.langchain4j.ollama.chat-model.temperature=0.2
quarkus.langchain4j.ollama.timeout=120s
# Pakai Ollama yang sudah jalan, jangan start Dev Service / pull model otomatis
quarkus.langchain4j.ollama.devservices.enabled=false
quarkus.langchain4j.ollama.log-requests=true
quarkus.langchain4j.ollama.log-responses=true

# Embedding model untuk RAG
quarkus.langchain4j.ollama.embedding-model.model-id=nomic-embed-text

# Easy RAG: baca semua file .txt di folder rag-docs saat aplikasi start
quarkus.langchain4j.easy-rag.path=rag-docs
quarkus.langchain4j.easy-rag.path-matcher=glob:**.txt
quarkus.langchain4j.easy-rag.max-segment-size=300
quarkus.langchain4j.easy-rag.max-overlap-size=30
quarkus.langchain4j.easy-rag.max-results=3

# MySQL (container demo-mysql yang sudah ada, schema clinic; dibuat oleh db/init.sql)
quarkus.datasource.db-kind=mysql
quarkus.datasource.username=clinic_app
quarkus.datasource.password=clinic_app_pass
quarkus.datasource.jdbc.url=jdbc:mysql://demo-mysql:3306/clinic
%dev.quarkus.datasource.jdbc.url=jdbc:mysql://localhost:3306/clinic
# Cek koneksi sebelum dipakai, supaya pool pulih sendiri kalau MySQL di-restart
quarkus.datasource.jdbc.validate-on-borrow=true
# Pakai MySQL yang sudah jalan, jangan start container Dev Services sendiri
quarkus.datasource.devservices.enabled=false
quarkus.compose.devservices.enabled=false

# Redis sebagai embedding store RAG (container demo-redis yang sudah ada).
# Index dan prefix beda dengan demo HR (rag-index, rag:), jadi reindex tidak menghapus data HR
quarkus.redis.hosts=redis://demo-redis:6379
%dev.quarkus.redis.hosts=redis://localhost:6379
quarkus.redis.devservices.enabled=false
quarkus.langchain4j.redis.dimension=768
quarkus.langchain4j.redis.index-name=med-rag-index
quarkus.langchain4j.redis.prefix=med-rag:
# Dokumen tidak dibaca ulang tiap start (Redis menyimpan permanen); lihat RagIngestion
quarkus.langchain4j.easy-rag.ingestion-strategy=MANUAL
